<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0a0a0a;color:#fff}
.header{background:#1a1a1a;padding:12px;text-align:center;border-bottom:2px solid #ff9f0a;position:sticky;top:0;z-index:100}
.header h1{color:#ff9f0a;font-size:18px}
.nav{display:flex;overflow-x:auto;background:#1c1c1e;gap:4px;padding:8px;position:sticky;top:56px;z-index:99}
.nav button{flex:0 0 auto;background:#2c2c2e;color:#fff;border:none;padding:8px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;font-size:12px}
.nav button.active{background:#ff9f0a;color:#000;font-weight:bold}
.content{padding:15px;max-width:900px;margin:0 auto;padding-bottom:100px}
label{display:block;margin:10px 0 3px;color:#aaa;font-size:12px;font-weight:bold}
input,select,textarea{width:100%;padding:10px;background:#1c1c1e;border:1px solid #333;color:#fff;border-radius:8px;font-size:14px;margin-bottom:5px}
textarea{min-height:70px;resize:vertical}
.btn{background:#ff9f0a;color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin:8px 4px 8px 0;font-size:13px}
.btn-blue{background:#0a84ff;color:#fff}
.btn-red{background:#ff3b30;color:#fff}
.btn-green{background:#30d158;color:#000}
.btn-sm{padding:6px 12px;font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
th,td{border:1px solid #333;padding:5px;text-align:left;vertical-align:top}
th{background:#1c1c1e;color:#ff9f0a;font-size:11px}
.card{background:#1c1c1e;border-radius:10px;padding:12px;margin:8px 0;border:1px solid #333}
.card h4{margin-bottom:8px;color:#ff9f0a}
.tag{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;margin:2px}
.tag-pass{background:#30d158;color:#000}
.tag-fail{background:#ff3b30;color:#fff}
.tag-open{background:#ff9f0a;color:#000}
.tag-closed{background:#30d158;color:#000}
.report-preview{background:#fff;color:#000;padding:20px;border-radius:8px;font-family:monospace;font-size:11px;line-height:1.5}
.report-preview h3{text-align:center;text-transform:uppercase;font-size:13px}
.report-preview h4{font-size:12px;margin-top:10px}
.report-preview hr{border:1px solid #000}
.report-preview table{border:1px solid #000;font-size:10px}
.report-preview td,.report-preview th{border:1px solid #000;color:#000;padding:3px}
.report-preview th{background:#ddd}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff9f0a;color:#000;padding:10px 20px;border-radius:20px;font-weight:bold;display:none;z-index:1000}
@media print{body{background:#fff;color:#000}.header,.nav,.btn,.toast{display:none}.content{padding:0}.report-preview{border-radius:0}}
.hamburger{position:absolute;left:10px;top:10px;font-size:24px;cursor:pointer;color:#ff9f0a;z-index:101;background:none;border:none}.sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#111;z-index:200;transition:left 0.3s;overflow-y:auto;padding:60px 15px 20px;box-shadow:2px 0 10px rgba(0,0,0,0.5)}.sidebar.open{left:0}.sidebar button{display:block;width:100%;text-align:left;padding:12px;background:none;color:#fff;border:none;font-size:13px;cursor:pointer;border-radius:8px;margin:2px 0}.sidebar button.active{background:#ff9f0a;color:#000;font-weight:bold}.sidebar button:hover{background:#333}.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:199;display:none}.overlay.show{display:block}.header{position:relative;text-align:center}
/* Desktop & Tablet */
@media screen and (min-width: 768px) {
    .content { max-width: 1100px; padding: 20px 40px; }
    .header h1 { font-size: 24px; }
    .nav { justify-content: center; flex-wrap: wrap; padding: 10px 20px; }
    .nav button { font-size: 13px; padding: 10px 16px; }
    .row { gap: 15px; }
    .card { padding: 16px; }
    table { font-size: 13px; }
    th, td { padding: 8px; }
    .btn { font-size: 14px; }
    .report-preview { font-size: 12px; padding: 30px; max-width: 800px; margin: 0 auto; }
    input, select, textarea { font-size: 15px; padding: 12px; }
    label { font-size: 13px; }
}
@media screen and (min-width: 1024px) {
    .content { max-width: 1200px; }
    .report-preview { max-width: 900px; }
    .header { padding: 16px 40px; }
}
</style>
</head>

function calcMix(){
var l=parseFloat((document.getElementById("_cpL")||{}).value)||0;
var w=parseFloat((document.getElementById("_cpW")||{}).value)||0;
var hh=parseFloat((document.getElementById("_cpH")||{}).value)||0;
var vol=l*w*(hh/1000);
var waste=parseFloat((document.getElementById("_cpWaste")||{}).value)||1;vol*=waste;
var grade=(document.getElementById("_cpGrade")||{}).value||"";
var mx=CONCRETE_MIXES[grade]||{cement:"0",sand:"0",ballast:"0",water:"0"};
var cem=parseFloat(mx.cement)||0;var bags=Math.ceil((vol*cem)/50);
var sand=(vol*parseFloat(mx.sand)||0).toFixed(2);
var ballast=(vol*parseFloat(mx.ballast)||0).toFixed(2);
var water=Math.round(vol*parseFloat(mx.water)||0);
var r=document.getElementById("_cpResult");
if(r)r.innerHTML='<b style="color:#ff9f0a">Volume: '+vol.toFixed(3)+' m3</b><br>Cement: <b>'+bags+' bags</b> ('+(bags*50)+' kg)<br>Sand: '+sand+' m3 | Ballast: '+ballast+' m3 | Water: ~'+water+' litres';
}

function saveConc(){
if(!D.concretePours)D.concretePours=[];
var l=parseFloat((document.getElementById("_cpL")||{}).value)||0;
var w=parseFloat((document.getElementById("_cpW")||{}).value)||0;
var hh=parseFloat((document.getElementById("_cpH")||{}).value)||0;
var vol=l*w*(hh/1000);
var waste=parseFloat((document.getElementById("_cpWaste")||{}).value)||1;vol*=waste;
var grade=(document.getElementById("_cpGrade")||{}).value||"";
var mx=CONCRETE_MIXES[grade]||{cement:"0"};
var bags=Math.ceil((vol*parseFloat(mx.cement)||0)/50);
D.concretePours.push({id:uid(),date:document.getElementById("_entryDate").value,category:document.getElementById("_cpCat").value,element:document.getElementById("_cpLoc").value,grade:grade,volume:vol.toFixed(2),cementBags:bags,status:document.getElementById("_cpStatus").value,notes:document.getElementById("_cpNotes").value,timestamp:Date.now()});
save();toast("Pour saved!");go("concrete");
}

function getKenyanWeather(){
var m=new Date(globalDate).getMonth();
if(m>=2&&m<=4)return {morning:"Rainy",afternoon:"Rainy",temp:"18-26C",ground:"Muddy"};
if(m>=9&&m<=11)return {morning:"Rainy",afternoon:"Cloudy",temp:"19-27C",ground:"Muddy"};
if(m>=5&&m<=8)return {morning:"Cloudy",afternoon:"Sunny",temp:"15-24C",ground:"Dry"};
return {morning:"Sunny",afternoon:"Sunny",temp:"20-30C",ground:"Dry"};
}
function autoWeather(){
var w=getKenyanWeather();
if(!D.weatherMorning||D.weatherMorning==="")D.weatherMorning=w.morning;
if(!D.weatherAfternoon||D.weatherAfternoon==="")D.weatherAfternoon=w.afternoon;
if(!D.tempNotes||D.tempNotes==="")D.tempNotes=w.temp;
if(!D.groundCondition||D.groundCondition==="")D.groundCondition=w.ground;
save();
}
