<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0a0a0a;color:#fff}
.header{background:#1a1a1a;padding:12px;text-align:center;border-bottom:2px solid #ff9f0a;position:sticky;top:0;z-index:100}
.header h1{color:#ff9f0a;font-size:18px}
.nav{display:flex;overflow-x:auto;background:#1c1c1e;gap:4px;padding:8px;position:sticky;top:56px;z-index:99}
.nav button{flex:0 0 auto;background:#2c2c2e;color:#fff;border:none;padding:8px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;font-size:12px}
.nav button.active{background:#ff9f0a;color:#000;font-weight:bold}
.content{padding:15px;max-width:900px;margin:0 auto;padding-bottom:100px}
label{display:block;margin:10px 0 3px;color:#aaa;font-size:12px;font-weight:bold}
input,select,textarea{width:100%;padding:10px;background:#1c1c1e;border:1px solid #333;color:#fff;border-radius:8px;font-size:14px;margin-bottom:5px}
textarea{min-height:70px;resize:vertical}
.btn{background:#ff9f0a;color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin:8px 4px 8px 0;font-size:13px}
.btn-blue{background:#0a84ff;color:#fff}
.btn-red{background:#ff3b30;color:#fff}
.btn-green{background:#30d158;color:#000}
.btn-sm{padding:6px 12px;font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
th,td{border:1px solid #333;padding:5px;text-align:left;vertical-align:top}
th{background:#1c1c1e;color:#ff9f0a;font-size:11px}
.card{background:#1c1c1e;border-radius:10px;padding:12px;margin:8px 0;border:1px solid #333}
.card h4{margin-bottom:8px;color:#ff9f0a}
.tag{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;margin:2px}
.tag-pass{background:#30d158;color:#000}
.tag-fail{background:#ff3b30;color:#fff}
.tag-open{background:#ff9f0a;color:#000}
.tag-closed{background:#30d158;color:#000}
.report-preview{background:#fff;color:#000;padding:20px;border-radius:8px;font-family:monospace;font-size:11px;line-height:1.5}
.report-preview h3{text-align:center;text-transform:uppercase;font-size:13px}
.report-preview h4{font-size:12px;margin-top:10px}
.report-preview hr{border:1px solid #000}
.report-preview table{border:1px solid #000;font-size:10px}
.report-preview td,.report-preview th{border:1px solid #000;color:#000;padding:3px}
.report-preview th{background:#ddd}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff9f0a;color:#000;padding:10px 20px;border-radius:20px;font-weight:bold;display:none;z-index:1000}
@media print{body{background:#fff;color:#000}.header,.nav,.btn,.toast{display:none}.content{padding:0}.report-preview{border-radius:0}}
.hamburger{position:absolute;left:10px;top:10px;font-size:24px;cursor:pointer;color:#ff9f0a;z-index:101;background:none;border:none}.sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#111;z-index:200;transition:left 0.3s;overflow-y:auto;padding:60px 15px 20px;box-shadow:2px 0 10px rgba(0,0,0,0.5)}.sidebar.open{left:0}.sidebar button{display:block;width:100%;text-align:left;padding:12px;background:none;color:#fff;border:none;font-size:13px;cursor:pointer;border-radius:8px;margin:2px 0}.sidebar button.active{background:#ff9f0a;color:#000;font-weight:bold}.sidebar button:hover{background:#333}.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:199;display:none}.overlay.show{display:block}.header{position:relative;text-align:center}
/* Desktop & Tablet */
@media screen and (min-width: 768px) {
    .content { max-width: 1100px; padding: 20px 40px; }
    .header h1 { font-size: 24px; }
    .nav { justify-content: center; flex-wrap: wrap; padding: 10px 20px; }
    .nav button { font-size: 13px; padding: 10px 16px; }
    .row { gap: 15px; }
    .card { padding: 16px; }
    table { font-size: 13px; }
    th, td { padding: 8px; }
    .btn { font-size: 14px; }
    .report-preview { font-size: 12px; padding: 30px; max-width: 800px; margin: 0 auto; }
    input, select, textarea { font-size: 15px; padding: 12px; }
    label { font-size: 13px; }
}
@media screen and (min-width: 1024px) {
    .content { max-width: 1200px; }
    .report-preview { max-width: 900px; }
    .header { padding: 16px 40px; }
}
</style>
</head>

save();}
rebuildStock();

function autoBackup(){backupData();setTimeout(autoBackup,300000);} // Every 5 minutes
function exportBackup(){var backup=localStorage.getItem(K+"_backup");if(!backup){toast("No backup available");return;}var blob=new Blob([backup],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ConstructionManager_Backup_"+today()+".json";a.click();toast("Backup downloaded!");}
function importBackup(file){var reader=new FileReader();reader.onload=function(e){try{var backup=JSON.parse(e.target.result);if(backup.data){D=backup.data;save();backupData();toast("Data restored successfully!");go("project");}}catch(err){toast("Invalid backup file");}};reader.readAsText(file);}
function checkLastBackup(){var last=localStorage.getItem(K+"_lastBackup");if(last){var days=Math.floor((Date.now()-parseInt(last))/86400000);if(days>=1){toast("Last backup: "+days+" day(s) ago. Export a backup!");}}}

function calcMix(){
var l=parseFloat((document.getElementById("_cpL")||{}).value)||0;
var w=parseFloat((document.getElementById("_cpW")||{}).value)||0;
var hh=parseFloat((document.getElementById("_cpH")||{}).value)||0;
var vol=l*w*(hh/1000);
var waste=parseFloat((document.getElementById("_cpWaste")||{}).value)||1;vol*=waste;
var grade=(document.getElementById("_cpGrade")||{}).value||"";
var mx=CONCRETE_MIXES[grade]||{cement:"0",sand:"0",ballast:"0",water:"0"};
var cem=parseFloat(mx.cement)||0;var bags=Math.ceil((vol*cem)/50);
var sand=(vol*parseFloat(mx.sand)||0).toFixed(2);
var ballast=(vol*parseFloat(mx.ballast)||0).toFixed(2);
var water=Math.round(vol*parseFloat(mx.water)||0);
var r=document.getElementById("_cpResult");
if(r)r.innerHTML='<b style="color:#ff9f0a">Volume: '+vol.toFixed(3)+' m3</b><br>Cement: <b>'+bags+' bags</b> ('+(bags*50)+' kg)<br>Sand: '+sand+' m3 | Ballast: '+ballast+' m3 | Water: ~'+water+' litres';
}

function saveConc(){
if(!D.concretePours)D.concretePours=[];
var l=parseFloat((document.getElementById("_cpL")||{}).value)||0;
var w=parseFloat((document.getElementById("_cpW")||{}).value)||0;
var hh=parseFloat((document.getElementById("_cpH")||{}).value)||0;
var vol=l*w*(hh/1000);
var waste=parseFloat((document.getElementById("_cpWaste")||{}).value)||1;vol*=waste;
var grade=(document.getElementById("_cpGrade")||{}).value||"";
var mx=CONCRETE_MIXES[grade]||{cement:"0"};
var bags=Math.ceil((vol*parseFloat(mx.cement)||0)/50);
D.concretePours.push({id:uid(),date:document.getElementById("_entryDate").value,category:document.getElementById("_cpCat").value,element:document.getElementById("_cpLoc").value,grade:grade,volume:vol.toFixed(2),cementBags:bags,status:document.getElementById("_cpStatus").value,notes:document.getElementById("_cpNotes").value,timestamp:Date.now()});
save();toast("Pour saved!");go("concrete");
}

function saveWorker(){if(!D.workers)D.workers=[];D.workers.push({id:uid(),name:document.getElementById("_wName").value,trade:document.getElementById("_wTrade").value,company:document.getElementById("_wCompany").value,phone:document.getElementById("_wPhone").value});save();toast("Worker registered!");go("labour");}
function removeWorker(id){D.workers=D.workers.filter(function(w){return w.id!==id;});if(D.attendance)D.attendance=D.attendance.filter(function(a){return a.workerId!==id;});save();toast("Worker removed");go("labour");}
function toggleAttendance(workerId){if(!D.attendance)D.attendance=[];var existing=D.attendance.filter(function(a){return a.workerId===workerId&&a.date===globalDate;});if(existing.length>0){D.attendance=D.attendance.filter(function(a){return !(a.workerId===workerId&&a.date===globalDate);});}else{var w=D.workers.find(function(x){return x.id===workerId;});D.attendance.push({id:uid(),workerId:workerId,name:w?w.name:"",trade:w?w.trade:"",date:globalDate,status:"Present",task:"",timestamp:Date.now()});}save();go("labour");}
function assignTask(workerId){var task=document.getElementById("_task_"+workerId).value;var att=D.attendance.find(function(a){return a.workerId===workerId&&a.date===globalDate;});if(att){if(!att.tasks)att.tasks=[];if(task&&att.tasks.indexOf(task)===-1){att.tasks.push(task);att.task=att.tasks.join(", ");save();toast("Task added: "+task);go("labour");}else if(task){toast("Task already assigned");}}}
function removeTask(attId,taskIdx){var att=D.attendance.find(function(a){return a.id===attId;});if(att&&att.tasks&&taskIdx>=0&&taskIdx<att.tasks.length){att.tasks.splice(taskIdx,1);att.task=att.tasks.join(", ");save();toast("Task removed!");go("labour");}}

RENDER["formwork"]=function(){
var h='<h2>Formwork & Scaffolding</h2><p style="color:#aaa;font-size:12px">Track formwork by category - Foundation to Roof</p>';
h+='<div style="display:flex;gap:8px;margin:10px 0"><button class="btn btn-blue btn-sm" onclick="showFWForm()">+ Add Formwork</button></div>';
var fw=(D.formwork||[]);
if(fw.length===0){h+='<p style="color:#666">No formwork recorded. Add items from 12 categories covering all building levels.</p>';}
else{
var cats={};for(var i=0;i<fw.length;i++){var f=fw[i];if(!cats[f.category])cats[f.category]=[];cats[f.category].push(f);}
var ck=Object.keys(cats);
for(var c=0;c<ck.length;c++){var cat=ck[c];var items=cats[cat];
h+='<div class="card"><div style="display:flex;justify-content:space-between"><h4>'+cat+' ('+items.length+')</h4></div><table style="font-size:11px"><tr><th>Item</th><th>Location</th><th>Qty</th><th>Status</th><th></th></tr>';
for(var i=0;i<items.length;i++){var f=items[i];h+='<tr><td>'+f.name+'</td><td>'+f.location+'</td><td>'+f.qty+'</td><td><span class="tag '+(f.status==="Completed"||f.status==="Inspected"?"tag-pass":f.status==="Erected"||f.status==="Concrete poured"?"tag-open":"")+'">'+f.status+'</span></td><td><button class="btn btn-red btn-sm" style="padding:2px 6px;font-size:10px" onclick="delItem(\'formwork\',\''+f.id+'\');go(\'formwork\')">X</button></td></tr>';}
h+='</table></div>';}
}
return h;
};

function showFWForm(){
var cats="";var ck=Object.keys(FORMWORK_CATEGORIES);for(var i=0;i<ck.length;i++){cats+='<option value="'+ck[i]+'">'+ck[i]+'</option>';}
var h='<h3>Add Formwork Item</h3><label>Date:</label><input type="date" id="_entryDate" value="'+globalDate+'" max="'+today()+'"><label>Category:</label><select id="_fwCat" onchange="loadFWItems()">'+cats+'</select><label>Item:</label><select id="_fwItem"></select><label>Location:</label><input id="_fwLoc" placeholder="e.g. Block A GF, Grid 1-3"><div class="row"><div><label>Quantity:</label><input id="_fwQty" type="number" value="1"></div><div><label>Status:</label><select id="_fwStatus">';
for(var i=0;i<FORMWORK_STATUS.length;i++){h+='<option>'+FORMWORK_STATUS[i]+'</option>';}
h+='</select></div></div><label>Notes:</label><input id="_fwNotes"><button class="btn" onclick="saveFW()">Save Item</button><button class="btn btn-secondary" onclick="go(\'formwork\')">Cancel</button>';
document.getElementById("content").innerHTML=h;loadFWItems();
}

function loadFWItems(){var cat=document.getElementById("_fwCat").value;var items=FORMWORK_CATEGORIES[cat]||[];var h="";for(var i=0;i<items.length;i++){h+='<option>'+items[i]+'</option>';}document.getElementById("_fwItem").innerHTML=h;}

function saveFW(){
if(!D.formwork)D.formwork=[];
var d=document.getElementById("_entryDate").value;
var name=document.getElementById("_fwItem").value;
var loc=document.getElementById("_fwLoc").value;
var cat=document.getElementById("_fwCat").value;
D.formwork.push({id:uid(),date:d,category:cat,name:name,location:loc,qty:document.getElementById("_fwQty").value,status:document.getElementById("_fwStatus").value,notes:document.getElementById("_fwNotes").value,timestamp:Date.now()});
autoDiary("Formwork - "+name,loc,"Category: "+cat+" | Status: "+document.getElementById("_fwStatus").value,d);
save();toast("Formwork saved + diary!");go("formwork");
}

RENDER["bbs"]=function(){
var h='<h2>Bar Bending Schedule (BBS)</h2><p style="color:#aaa;font-size:12px">Reinforcement steel tracking by structural element</p>';
h+='<div style="display:flex;gap:8px;margin:10px 0"><button class="btn btn-blue btn-sm" onclick="showBBSForm()">+ Add Bar</button></div>';
var bbs=(D.bbs||[]);
if(bbs.length===0){h+='<p style="color:#666">No reinforcement recorded. Add bars by category and track fabrication.</p>';}
else{
var cats={};for(var i=0;i<bbs.length;i++){var b=bbs[i];if(!cats[b.category])cats[b.category]=[];cats[b.category].push(b);}
var ck=Object.keys(cats);
for(var c=0;c<ck.length;c++){var cat=ck[c];var items=cats[cat];
h+='<div class="card"><h4>'+cat+' ('+items.length+' bars)</h4><table style="font-size:10px"><tr><th>Bar Ref</th><th>Type/Size</th><th>No.Off</th><th>Length(m)</th><th>Total(m)</th><th>Wt(kg)</th><th>Status</th><th></th></tr>';
for(var i=0;i<items.length;i++){var b=items[i];var totLen=b.qty*b.length;var wt=(totLen*parseFloat(b.wtPerM||0.888)).toFixed(1);h+='<tr><td>'+b.ref+'</td><td>'+b.name+'</td><td>'+b.qty+'</td><td>'+b.length+'</td><td>'+totLen+'</td><td>'+wt+'</td><td><span class="tag '+(b.status==="Approved"||b.status==="Inspected"?"tag-pass":"tag-open")+'">'+b.status+'</span></td><td><button class="btn btn-red btn-sm" style="padding:1px 4px;font-size:9px" onclick="delItem(\'bbs\',\''+b.id+'\');go(\'bbs\')">X</button></td></tr>';}
h+='</table></div>';}
}
return h;
};

var CONCRETE_DEFECTS={
"Honeycombing":{desc:"Voids in hardened concrete where mortar is missing, leaving coarse aggregate exposed",causes:"Inadequate compaction, congested reinforcement, harsh mix, improper placement",checks:["Tap with hammer to estimate depth","Use steel scale to probe voids","Check if extending behind rebar"],repair:"Expose sound concrete, clean, apply bonding agent, fill with repair mortar"},
"Cracks - Plastic Shrinkage":{desc:"Shallow random cracks appearing within hours/days of pouring",causes:"Rapid surface drying, high evaporation rate, delayed curing",checks:["Measure width with crack gauge","Check depth - usually shallow","Monitor if active with marker"],repair:"Surface sealing if shallow, epoxy injection if structural"},
"Cracks - Drying Shrinkage":{desc:"Vertical pattern cracks increasing over time as moisture leaves",causes:"Excess water in mix, inadequate curing, high cement content",checks:["Pattern - vertical orientation","Width measurement over time","Check if extends through section"],repair:"Flexible sealant for minor cracks, epoxy injection for structural"},
"Cracks - Structural":{desc:"Diagonal cracks indicating stress, overload, or foundation movement",causes:"Overloading, settlement, design deficiency, corrosion of rebar",checks:["Diagonal pattern - angle from vertical","Measure width and depth","Monitor for activity immediately"],repair:"URGENT: Consult structural engineer, strengthen with FRP or additional concrete"},
"Spalling":{desc:"Concrete cover breaking away from reinforcement due to rust expansion",causes:"Moisture ingress → steel corrosion → rust expands 6-10x → cover cracks",checks:["Rust staining visible?","Hollow sound around spall?","Find moisture source"],repair:"Remove loose concrete, clean rebar, apply anti-corrosion coating, patch with repair mortar"},
"Efflorescence":{desc:"White crystalline salt deposits on surface from water movement",causes:"Moisture carrying soluble salts to surface, groundwater, leakage",checks:["Wipe with damp cloth - returns in weeks?","Find moisture path","Check joints and cracks"],repair:"Stop moisture source first, clean surface, apply breathable sealer"},
"Segregation":{desc:"Coarse aggregate separates from mortar during handling/placing",causes:"Excessive slump, drop height >1.5m, over-vibration, poor mix",checks:["Check drop height during placement","Look for mortar-rich top layer","Check aggregate concentration at bottom"],repair:"Remove and replace severely segregated areas, control placement methods"},
"Scaling":{desc:"Surface mortar flakes or peels away in thin layers",causes:"Weak surface, high w/c ratio, finishing over bleed water, freeze-thaw",checks:["Test depth of scaling","Check if extending deeper","Check for bleed water signs"],repair:"Remove loose material, apply surface hardener or overlay"},
"Delamination":{desc:"Surface layer separates from substrate but remains in place",causes:"Finishing over bleed water, trapped air, poor bond between layers",checks:["Tap with hammer - hollow sound?","Map hollow zones with chalk","Check extent before breaking"],repair:"Remove delaminated area, roughen substrate, apply bonding agent, re-pour"},
"Dusting":{desc:"Surface turns powdery, produces fine cement powder when rubbed",causes:"High water at surface, finishing over bleed water, inadequate curing",checks:["Rub surface - does powder come off?","Test depth of weak layer","Check hardness progression"],repair:"Apply liquid hardener, or remove weak layer and apply topping"},
"Bleeding":{desc:"Excess water rising to surface after placement",causes:"High w/c ratio, over-vibration, poor aggregate grading",checks:["Check water on surface after compaction","Check if finishing done over bleed water","Associated with scaling/dusting"],repair:"Allow bleed water to evaporate before finishing, adjust mix design"}

function getKenyanWeather(){
var m=new Date(globalDate).getMonth();
if(m>=2&&m<=4)return {morning:"Rainy",afternoon:"Rainy",temp:"18-26C",ground:"Muddy"};
if(m>=9&&m<=11)return {morning:"Rainy",afternoon:"Cloudy",temp:"19-27C",ground:"Muddy"};
if(m>=5&&m<=8)return {morning:"Cloudy",afternoon:"Sunny",temp:"15-24C",ground:"Dry"};
return {morning:"Sunny",afternoon:"Sunny",temp:"20-30C",ground:"Dry"};
}
function autoWeather(){

if(!D.weatherMorning||D.weatherMorning==="")D.weatherMorning=w.morning;
if(!D.weatherAfternoon||D.weatherAfternoon==="")D.weatherAfternoon=w.afternoon;
if(!D.tempNotes||D.tempNotes==="")D.tempNotes=w.temp;
if(!D.groundCondition||D.groundCondition==="")D.groundCondition=w.ground;
save();
}
